name: Feature or contributor task
description: Propose a focused improvement or implementation task
title: "[Task]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Describe a focused task with a clear scope and a way to verify completion.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What problem should this task solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should change, and what is explicitly out of scope?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List the observable conditions that mean the task is complete.
      placeholder: |-
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification details
      description: List tests or manual steps that will verify the change.
    validations:
      required: true